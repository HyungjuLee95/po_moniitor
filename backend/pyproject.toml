[project]
name = "po-monitor-main-api"
version = "0.1.0"
description = "SAP PO monitoring API"
requires-python = "==3.11.7"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "PyJWT>=2.10,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "requests>=2.32,<3.0",
  "zeep>=4.3,<5.0",
  "oracledb>=2.5,<4.0",
  "openpyxl>=3.1,<4.0",
  "hdbcli>=2.22,<3.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["migrations*", "oracle*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
